[project]
name = "mcp-hub"
version = "0.1.0"
description = "Unified multi-node MCP Hub for research, local AI, and distributed ML experiments."
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.29.0",
    "boto3>=1.35.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "mcp>=1.6.0,<2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
